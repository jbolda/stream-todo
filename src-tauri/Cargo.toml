[package]
authors = ["you"]
description = "A TODO list for streamers"
edition = "2021"
license = "Apache-2.0"
name = "stream-todo"
repository = ""
version = "0.3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# tauri = { version = "2.2", features = ["tray-icon", "image-png"] }
tauri = { version = "2", default-features = false, features = [
    "common-controls-v6",
    "tray-icon",
    "image-png",
] }
tauri-runtime-verso = { git = "https://github.com/versotile-org/tauri-runtime-verso", branch = "main" }
tauri-plugin-polyfill = { path = "../tauri-plugin-polyfill/" }
tauri-plugin-devtools = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
